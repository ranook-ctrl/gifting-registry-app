<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gifting Registry</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #e9eaf0;
        /* The phone frame is scaled to fit exactly (see landing/useDeviceScale.ts);
           clip the sub-pixel remainder so no phone gets a sideways scrollbar. */
        overflow-x: hidden;
        /* Stop iOS Safari inflating text in landscape, which would fight the scale. */
        -webkit-text-size-adjust: 100%;
      }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
